# The companion coordinator (src/index.ts). Local: `npm run dev` serves it on http://127.0.0.1:8787.
name = "relay-companion"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "../frontend/dist-companion"
binding = "ASSETS"
not_found_handling = "single-page-application"
# No `run_worker_first`: a list of paths there sends every other path to the files first, so /ws/ got the app's page
# and phones could not connect (2026-11-24). Requests that are not page loads already reach the worker when no file
# matches, which is where a missing built file is answered 404 (src/index.ts).

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]
