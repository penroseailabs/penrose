<!doctype html>
<!-- The README's pictures, drawn with penrose's own design tokens (frontend/src/styles/tokens.css): a marble canvas
     laid with a Penrose tiling, soft clay surfaces, graphite ink, Fraunces for the name. One scene per page load:
     scenes.html?scene=hero&theme=light. render.py turns every scene into docs/readme/<scene>-<theme>.png. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../frontend/node_modules/@fontsource-variable/fraunces/full.css">
<link rel="stylesheet" href="../../../frontend/node_modules/@fontsource-variable/inter/wght.css">
<link rel="stylesheet" href="../../../frontend/src/styles/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font: 15px/1.5 var(--font); letter-spacing: -0.006em; color: var(--ink);
    -webkit-font-smoothing: antialiased; font-synthesis: none; background: transparent;
  }
  .scene { position: relative; overflow: hidden; }
  /* the marble: glows, the tiling (drawn below into --tiles), grain; the same layers as the app's body */
  .marble {
    background-color: var(--canvas);
    background-image: var(--glows), var(--tiles, none), var(--grain);
    background-size: auto, auto, 100% 100%, 180px 180px;
    background-blend-mode: normal, normal, normal, soft-light;
  }
  .rounded { border-radius: 28px; corner-shape: squircle; }
  .clay { background: var(--clay); box-shadow: var(--e2); }
  .panel { background: var(--clay); box-shadow: var(--panel); }
  .well { background: var(--well); box-shadow: var(--inset); }
  .wordmark { font-family: var(--font-brand); font-weight: 600; font-variation-settings: "SOFT" 100; letter-spacing: -0.01em; line-height: 1; }
  .serif { font-family: var(--font-brand); font-variation-settings: "SOFT" 100, "WONK" 0; }
  .muted { color: var(--ink-2); }
  .faint { color: var(--ink-3); }
  .mono { font-family: var(--mono); }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 46px; padding: 0 22px;
    border-radius: 13px; corner-shape: squircle; font-size: 16px; font-weight: 550; color: var(--ink);
    background: var(--clay); box-shadow: var(--e1); white-space: nowrap;
  }
  .btn.primary {
    color: var(--on-accent);
    background: linear-gradient(160deg, color-mix(in oklab, var(--accent) calc(100% - 14% * var(--k)), white), var(--accent));
    box-shadow: -1.6px -1.6px 4px var(--hi), 1.6px 2.4px 5.6px color-mix(in oklab, var(--accent) 36%, transparent),
      inset 0 1px 0 rgba(255, 255, 255, 0.22), inset 0 -1px 2px rgba(0, 0, 0, 0.065);
  }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- hero ---------- */
  #hero { width: 1200px; height: 540px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #hero .icon { width: 108px; height: 108px; border-radius: 26px; box-shadow: var(--e3); margin-bottom: 30px; }
  #hero .name { font-size: 104px; margin-bottom: 26px; }
  #hero h1 { font-size: 46px; line-height: 1.1; font-weight: 600; letter-spacing: -0.028em; margin: 0; }

  /* ---------- the link preview (GitHub's social preview, 1280x640) and the account picture ---------- */
  #social { width: 1280px; height: 640px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #social .icon { width: 132px; height: 132px; border-radius: 32px; box-shadow: var(--e3); margin-bottom: 34px; }
  #social .name { font-size: 132px; margin-bottom: 30px; }
  #social h1 { font-size: 52px; line-height: 1.1; font-weight: 600; letter-spacing: -0.028em; margin: 0; }
  #avatar { width: 500px; height: 500px; }
  #avatar img { width: 100%; height: 100%; display: block; }

  /* ---------- buttons, each its own small picture ---------- */
  .button-scene { display: inline-flex; padding: 10px 12px 14px; }

  /* ---------- what you see / what your agent sees ---------- */
  #sees { width: 1200px; height: 760px; display: grid; grid-template-columns: 380px 1fr; gap: 56px; align-items: center; padding: 0 70px; }
  .label { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 16px; text-align: center; }
  .handset {
    width: 340px; height: 640px; margin: 0 auto; border-radius: 52px; corner-shape: squircle; padding: 12px;
    background: linear-gradient(160deg, #3b3f46, #17191d); box-shadow: var(--e3), inset 0 1px 0 rgba(255,255,255,.18);
  }
  :root[data-theme="dark"] .handset { background: linear-gradient(160deg, #4a4e56, #0d0e10); }
  .screen { width: 100%; height: 100%; border-radius: 41px; corner-shape: squircle; overflow: hidden; background: #fbfbfa; color: #1d1d1f; display: flex; flex-direction: column; position: relative; font-size: 13px; }
  .statusbar { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 6px 26px 0; font-size: 12px; font-weight: 600; }
  .appbar { display: flex; align-items: center; gap: 10px; padding: 8px 18px 10px; }
  .appbar b { font-size: 19px; letter-spacing: -0.02em; }
  .tag { margin-left: auto; font-size: 11px; color: #5a6a4e; background: #e5efdc; padding: 3px 9px; border-radius: 99px; font-weight: 600; }
  .order { padding: 0 18px; display: flex; flex-direction: column; gap: 2px; }
  .item { display: flex; align-items: center; gap: 11px; padding: 9px 0 9px 14px; border-bottom: 1px solid #eeeeec; position: relative; }
  .thumb { width: 38px; height: 38px; border-radius: 10px; flex: none; }
  .item .t { flex: 1; line-height: 1.25; }
  .item .t small { display: block; color: #7b7b80; font-size: 11.5px; }
  .item .p { font-weight: 600; font-size: 12.5px; }
  .item.out .t, .item.out .p { opacity: 0.45; }
  .item.out small { color: #b5562e; opacity: 1; }
  .cta { margin: auto 16px 18px; height: 46px; border-radius: 14px; background: #2f6b3c; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; position: relative; }
  .num { position: absolute; left: -6px; top: 50%; transform: translateY(-50%); font: 600 10px/1 var(--mono); color: #fff; background: rgba(58,66,77,.86); padding: 3px 4px; border-radius: 5px; }
  .cta .num { left: 10px; }
  .tap { position: absolute; right: 22px; top: 50%; width: 30px; height: 30px; margin-top: -15px; border-radius: 50%; background: rgba(255,255,255,.35); box-shadow: 0 0 0 7px rgba(255,255,255,.18); }
  .agent { border-radius: 24px; corner-shape: squircle; padding: 26px 30px; font: 14.2px/1.72 var(--mono); letter-spacing: 0; white-space: pre; color: var(--ink-2); }
  .agent .k { color: var(--ink); font-weight: 600; }
  .agent .n { color: var(--accent-ink); font-weight: 600; }
  .agent .s { color: var(--ink); }
  .agent .d { color: var(--ink-3); }
  .agent .cmd { color: var(--ink); font-weight: 600; }
  .agent .ok { color: var(--green-ink); }
  .agent .hl { background: color-mix(in oklab, var(--accent) 12%, transparent); border-radius: 5px; margin: 0 -6px; padding: 0 6px; display: inline-block; }

  /* ---------- a conversation ---------- */
  #ask { width: 1200px; height: 720px; display: flex; align-items: center; justify-content: center; }
  .convo { width: 760px; border-radius: 26px; corner-shape: squircle; padding: 34px 38px 30px; display: flex; flex-direction: column; gap: 18px; font-size: 15.5px; }
  .you { align-self: flex-end; max-width: 78%; background: var(--bubble); padding: 11px 16px; border-radius: 19px; corner-shape: squircle; }
  .reply { display: flex; gap: 12px; align-items: flex-start; }
  .reply .avatar { width: 28px; height: 28px; border-radius: 8px; flex: none; margin-top: 1px; box-shadow: var(--e1); }
  .run { border-radius: 16px; corner-shape: squircle; padding: 14px 18px; display: flex; flex-direction: column; gap: 9px; font-size: 14px; }
  .step { display: flex; align-items: center; gap: 11px; }
  .step .faint { margin-left: auto; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .check { width: 17px; height: 17px; border-radius: 50%; background: var(--green); display: grid; place-items: center; flex: none; }
  .check svg { width: 11px; height: 11px; stroke: #fff; stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .pending { width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--amber); flex: none; }
  .askcard { border-radius: 16px; corner-shape: squircle; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
  .askcard .head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; color: var(--amber); letter-spacing: 0.02em; text-transform: uppercase; }
  .options { display: flex; gap: 10px; flex-wrap: wrap; }
  .options .btn { height: 36px; font-size: 14px; padding: 0 15px; border-radius: 10px; }
  .composer { margin-top: 4px; height: 50px; border-radius: 16px; corner-shape: squircle; display: flex; align-items: center; padding: 0 8px 0 18px; color: var(--ink-3); }
  .composer .send { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }

  /* ---------- a day ---------- */
  #day { width: 1200px; padding: 54px 50px 56px; }
  .moments { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; position: relative; }
  .moments::before { content: ""; position: absolute; left: -50px; right: -50px; top: 19px; height: 1px; background: var(--rule); }
  .moment { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .when { position: relative; align-self: flex-start; display: inline-flex; align-items: center; gap: 9px; height: 38px; padding: 0 16px 0 12px; border-radius: 99px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .when svg.i { width: 18px; height: 18px; color: var(--accent-ink); }
  .moment .card { flex: 1; padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 14px; font-size: 14.5px; line-height: 1.45; }
  .where { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
  .moment .you { max-width: 100%; align-self: flex-end; padding: 9px 14px; border-radius: 17px; }
  .back { display: flex; gap: 10px; align-items: flex-start; }
  .back img { width: 24px; height: 24px; border-radius: 7px; flex: none; margin-top: 1px; box-shadow: var(--e1); }
  .proof { margin-top: auto; padding-top: 12px; border-top: 1px solid var(--rule); display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--ink-2); }
  .proof .pending { width: 17px; height: 17px; }

  /* ---------- a call ---------- */
  #call { width: 1200px; height: 700px; display: flex; align-items: center; justify-content: center; }
  .callcard { border-radius: 18px; corner-shape: squircle; padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 14px; font-size: 14.5px; }
  .callcard .top { display: flex; align-items: center; gap: 13px; }
  .callcard .top .ico { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--green-ink); flex: none; }
  .callcard .top b { display: block; font-size: 15.5px; letter-spacing: -0.015em; }
  .callcard .top small { color: var(--ink-3); font-size: 13px; }
  .callcard .top .ended { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
  .said2 { display: grid; grid-template-columns: 66px 1fr; gap: 9px 12px; padding-top: 14px; border-top: 1px solid var(--rule); line-height: 1.45; }
  .said2 .who { font-size: 13px; font-weight: 600; color: var(--ink-3); padding-top: 1px; }

  /* ---------- features ---------- */
  #features { width: 1200px; padding: 56px 60px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }
  .card { border-radius: 22px; corner-shape: squircle; padding: 28px 28px 30px; }
  .card .ico { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; margin-bottom: 20px; color: var(--accent-ink); }
  .card h3 { margin: 0 0 8px; font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
  .card p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--ink-2); }

  /* ---------- how it works ---------- */
  #how { width: 1200px; padding: 56px; display: flex; flex-direction: column; justify-content: center; }
  .flow { display: grid; grid-template-columns: 0.95fr 34px 1fr 34px 1.2fr 34px 1.12fr; align-items: stretch; }
  .node { border-radius: 20px; corner-shape: squircle; padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 6px; }
  .node .k { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
  .node b { font-size: 19px; letter-spacing: -0.02em; }
  .node span { font-size: 14px; color: var(--ink-2); line-height: 1.45; }
  .node.main { background: linear-gradient(160deg, color-mix(in oklab, var(--accent) calc(100% - 14% * var(--k)), white), var(--accent)); color: var(--on-accent); }
  .node.main .k, .node.main span { color: color-mix(in oklab, var(--on-accent) 72%, transparent); }
  .arrow { display: grid; place-items: center; color: var(--ink-3); }
  .arrow svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .under { display: grid; grid-template-columns: 1fr 1fr; gap: 26px; margin-top: 30px; }
  .under .node { flex-direction: row; align-items: center; gap: 16px; }
  .under .node .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--accent-ink); flex: none; }

  /* ---------- the phone in your pocket ---------- */
  #pocket { width: 1200px; height: 700px; display: flex; align-items: center; justify-content: center; gap: 70px; }
  #pocket .handset { width: 320px; height: 620px; margin: 0; }
  .pocket-screen { background: var(--canvas); color: var(--ink); align-items: center; padding: 0 22px; background-image: var(--glows); }
  .orb { margin-top: 120px; width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center; position: relative; }
  .orb::before, .orb::after { content: ""; position: absolute; inset: -18px; border-radius: 50%; border: 1px solid color-mix(in oklab, var(--accent) 22%, transparent); }
  .orb::after { inset: -40px; border-color: color-mix(in oklab, var(--accent) 11%, transparent); }
  .orb .wordmark { font-size: 30px; }
  .heard { margin-top: 64px; text-align: center; font-size: 17px; line-height: 1.4; letter-spacing: -0.015em; }
  .said { margin-top: 14px; text-align: center; font-size: 14px; color: var(--ink-2); line-height: 1.45; }
  .pocket-bar { margin-top: auto; margin-bottom: 26px; display: flex; gap: 18px; }
  .pocket-bar .ib { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); }
  .pocket-bar .ib.end { background: var(--red); color: #fff; box-shadow: var(--e1); }
  .pocket-copy { width: 460px; }
  .pocket-copy .line { display: flex; gap: 16px; align-items: flex-start; padding: 18px 0; border-bottom: 1px solid var(--rule); }
  .pocket-copy .line:last-child { border-bottom: 0; }
  .pocket-copy .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--accent-ink); flex: none; }
  .pocket-copy b { display: block; font-size: 17px; letter-spacing: -0.015em; margin-bottom: 3px; }
  .pocket-copy span { color: var(--ink-2); font-size: 14.5px; }
</style>
</head>

<script type="module">
// ---- the tiling: the same construction as frontend/src/lib/penrose.ts and lib/tiledBackground.ts ----
const PHI = (1 + Math.sqrt(5)) / 2;
const add = (p, q) => [p[0] + q[0], p[1] + q[1]], sub = (p, q) => [p[0] - q[0], p[1] - q[1]], mul = (p, k) => [p[0] * k, p[1] * k];
function rhombs(centre, radius, generations, keep) {
  let tris = [];
  for (let i = 0; i < 10; i++) {
    let b = add(centre, mul([Math.cos(((2 * i - 1) * Math.PI) / 10), Math.sin(((2 * i - 1) * Math.PI) / 10)], radius));
    let c = add(centre, mul([Math.cos(((2 * i + 1) * Math.PI) / 10), Math.sin(((2 * i + 1) * Math.PI) / 10)], radius));
    if (i % 2 === 0) [b, c] = [c, b];
    tris.push({ thin: true, a: centre, b, c });
  }
  for (let g = 0; g < generations; g++) {
    const next = [];
    for (const t of tris) {
      if (t.thin) { const p = add(t.a, mul(sub(t.b, t.a), 1 / PHI)); next.push({ thin: true, a: t.c, b: p, c: t.b }, { thin: false, a: p, b: t.c, c: t.a }); }
      else {
        const q = add(t.b, mul(sub(t.a, t.b), 1 / PHI)), r = add(t.b, mul(sub(t.c, t.b), 1 / PHI));
        next.push({ thin: false, a: r, b: t.c, c: t.a }, { thin: false, a: q, b: r, c: t.b }, { thin: true, a: r, b: q, c: t.a });
      }
    }
    tris = next;
  }
  const seen = new Set(), out = [];
  for (const t of tris) {
    const mid = mul(add(t.b, t.c), 0.5), key = `${Math.round(mid[0] * 64)},${Math.round(mid[1] * 64)}`;
    if (seen.has(key)) continue; seen.add(key);
    if (keep && !keep(mid)) continue;
    out.push({ pts: [t.a, t.b, sub(add(t.b, t.c), t.a), t.c], mid });
  }
  return out;
}
function hash([x, y]) { const s = Math.sin(Math.round(x * 10) * 12.9898 + Math.round(y * 10) * 78.233) * 43758.5453; return s - Math.floor(s); }
function tiles(w, h, dark, { edge = 44, strength = 0.55, centre = [0.5, 0.5] } = {}) {
  const dpr = 2, W = w * dpr, H = h * dpr, c = [W * centre[0], H * centre[1]];
  const canvas = Object.assign(document.createElement("canvas"), { width: W, height: H }), g = canvas.getContext("2d");
  const radius = Math.hypot(Math.max(c[0], W - c[0]), Math.max(c[1], H - c[1])) * 1.12;
  const gens = Math.max(1, Math.round(Math.log(radius / (edge * dpr)) / Math.log(PHI))), m = edge * dpr * 2;
  g.lineJoin = "round"; g.lineWidth = 1.5;
  g.strokeStyle = dark ? `rgba(255,255,255,${0.06 * strength})` : `rgba(40,44,52,${0.06 * strength})`;
  for (const t of rhombs(c, radius, gens, ([x, y]) => x > -m && y > -m && x < W + m && y < H + m)) {
    g.beginPath(); t.pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath();
    const s = hash(t.mid) * 2 - 1;
    g.fillStyle = dark ? (s > 0 ? `rgba(255,255,255,${s * 0.03 * strength})` : `rgba(0,0,0,${-s * 0.12 * strength})`)
                       : (s > 0 ? `rgba(255,255,255,${s * 0.38 * strength})` : `rgba(30,34,44,${-s * 0.026 * strength})`);
    g.fill(); g.stroke();
  }
  return canvas.toDataURL("image/png");
}

const icon = (n, extra = "") => `<svg class="i" viewBox="0 0 24 24" ${extra}>${I[n]}</svg>`;

<span class="n">[1]</span> Button <span class="s">"Back"</span>

const q = new URLSearchParams(location.search);
const dark = q.get("theme") === "dark";
document.documentElement.dataset.theme = dark ? "dark" : "light";
document.body.innerHTML = scenes[q.get("scene") || "hero"]();
const scene = document.querySelector(".scene");
if (scene?.dataset.tiles) {
  const [w, h] = scene.dataset.tiles.split("x").map(Number);
  const centre = (scene.dataset.centre || "0.5,0.5").split(",").map(Number);
  scene.style.setProperty("--tiles", `url(${tiles(w, Math.max(h, scene.offsetHeight), dark, { centre })})`);
}
await document.fonts.ready;
await Promise.all([...document.images].map((im) => im.complete ? 0 : new Promise((r) => (im.onload = im.onerror = r))));
document.title = "ready";
</script>
</body>
